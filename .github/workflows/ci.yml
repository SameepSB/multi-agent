name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.18
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: uv
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Check formatting and lint
        run: |
          uv run --locked ruff format --check src tests
          uv run --locked ruff check src tests
      - name: Run deterministic tests
        run: uv run --locked pytest -q
      - name: Audit Python dependencies
        run: |
          trap 'rm -f requirements-audit.txt' EXIT
          uv export --locked --no-emit-project --format requirements-txt --output-file requirements-audit.txt
          uv run --locked pip-audit --strict --requirement requirements-audit.txt
      - name: Validate local Compose model
        run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet
      - name: Build the container image
        run: docker build --tag travel-comparator:ci .
      - name: Start the Compose stack
        run: docker compose --env-file .env.example -f deploy/compose.yaml up -d --build
      - name: Smoke-test API readiness and CLI
        run: |
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 3 \
              http://127.0.0.1:8080/health/ready; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose --env-file .env.example -f deploy/compose.yaml logs
            exit 1
          fi
          docker compose --env-file .env.example -f deploy/compose.yaml exec -T api \
            travel-comparator \
            "Compare Austin, Miami, and Denver for a 5-day trip from New York"
      - name: Stop the Compose stack
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose.yaml down --remove-orphans
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Validate Terraform
        run: |
          for dir in deploy/terraform deploy/terraform-vm; do
            terraform -chdir=$dir fmt -check -recursive
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done

name: Promote production

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "sha256 digest reported by a successful development deployment"
        required: true
        type: string
      development_run_id:
        description: "Run ID reported by that successful development deployment"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: travel-comparator-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable digest input
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
        run: |
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "image_digest must be a full sha256 digest." >&2
            exit 1
          fi
          if ! [[ "$DEVELOPMENT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "development_run_id must be a GitHub Actions run ID." >&2
            exit 1
          fi
      - name: Verify successful development promotion record
        env:
          DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh run view "$DEVELOPMENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headBranch,headSha,workflowName)"
          test "$(jq -r .conclusion <<< "$run")" = "success"
          test "$(jq -r .headBranch <<< "$run")" = "main"
          test "$(jq -r .workflowName <<< "$run")" = "Deploy development"
          gh run download "$DEVELOPMENT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "travel-comparator-image-${DEVELOPMENT_RUN_ID}" \
            --dir promotion-artifact
          expected_image="$(sed -n '1p' promotion-artifact/promotion-image.txt)"
          expected_commit="$(sed -n '2p' promotion-artifact/promotion-image.txt)"
          test "${expected_image##*@}" = "${{ inputs.image_digest }}"
          test "$expected_commit" = "$(jq -r .headSha <<< "$run")"
          echo "Verified promotion record for ${expected_image}."
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate to registry and verify image exists
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          az acr login --name "$ACR_NAME"
          registry="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          image_ref="${registry}/travel-comparator@${IMAGE_DIGEST}"
          docker pull "$image_ref"
          echo "IMAGE_REF=${image_ref}" >> "$GITHUB_ENV"
      - name: Rescan promoted image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Deploy production apps (Terraform)
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ENVIRONMENT_NAME: production
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
          TF_VAR_acr_name: ${{ vars.ACR_NAME }}
          TF_VAR_key_vault_name: ${{ vars.KEY_VAULT_NAME }}
          TF_VAR_oidc_issuer: ${{ vars.OIDC_ISSUER }}
          TF_VAR_oidc_jwks_url: ${{ vars.OIDC_JWKS_URL }}
          TF_VAR_nws_user_agent: ${{ vars.NWS_USER_AGENT }}
          TF_VAR_user_api_audience: ${{ vars.USER_API_AUDIENCE }}
          TF_VAR_weather_a2a_audience: ${{ vars.WEATHER_A2A_AUDIENCE }}
          TF_VAR_travel_a2a_audience: ${{ vars.TRAVEL_A2A_AUDIENCE }}
        run: |
          secret_uri="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name openai-api-key --query id --output tsv)"
          export TF_VAR_container_image="$IMAGE_REF"
          export TF_VAR_openai_secret_uri="$secret_uri"
          bash deploy/scripts/terraform-apply.sh
      - name: Verify ingress and readiness
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          api="${NAME_PREFIX}-api"
          weather="${NAME_PREFIX}-weather"
          travel="${NAME_PREFIX}-travel"
          test "$(az containerapp show --name "$api" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.external --output tsv)" = "true"
          test "$(az containerapp show --name "$weather" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.external --output tsv)" = "false"
          test "$(az containerapp show --name "$travel" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.external --output tsv)" = "false"
          fqdn="$(az containerapp show --name "$api" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "https://${fqdn}/health/ready"; then
              exit 0
            fi
            sleep 10
          done
          echo "Production API readiness probe failed." >&2
          exit 1
      - name: Record deployed digest
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
          DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
        run: |
          echo "Production now runs \`${IMAGE_REF}\` from development run \`${DEVELOPMENT_RUN_ID}\`." >> "$GITHUB_STEP_SUMMARY"

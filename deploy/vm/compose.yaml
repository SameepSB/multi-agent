name: travel-comparator

# Image-based stack for a single Linux VM. Variables come from /opt/travel-comparator/.env,
# written by deploy/scripts/vm-release.sh. Only Caddy publishes ports; the API and
# workers are reachable solely on the internal Docker network.
x-worker-env: &worker-env
  APP_ENV: local
  LOG_LEVEL: INFO
  REQUEST_TIMEOUT_SECONDS: "30"
  MAX_CITIES: "4"
  LOCAL_COORDINATOR_TOKEN: ${LOCAL_COORDINATOR_TOKEN:?}
  STUB_PROVIDERS: "${STUB_PROVIDERS:-false}"
  NWS_USER_AGENT: ${NWS_USER_AGENT:-}
  WEATHER_A2A_AUDIENCE: travel-comparator-weather-local
  TRAVEL_A2A_AUDIENCE: travel-comparator-travel-local
  TRAVEL_DATA_PATH: /app/data/travel_data.json

services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [travel]
    restart: unless-stopped

  api:
    image: ${IMAGE_REF:?}
    command:
      - uvicorn
      - travel_comparator.api.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      <<: *worker-env
      API_PORT: "8080"
      WEATHER_AGENT_URL: http://weather-agent:5001
      TRAVEL_AGENT_URL: http://travel-agent:5003
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace-me}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LOCAL_API_TOKEN: ${LOCAL_API_TOKEN:?}
    depends_on:
      weather-agent:
        condition: service_healthy
      travel-agent:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [travel]
    restart: unless-stopped

  weather-agent:
    image: ${IMAGE_REF:?}
    command:
      - uvicorn
      - travel_comparator.agents.weather_server:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "5001"
    environment: *worker-env
    expose: ["5001"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [travel]
    restart: unless-stopped

  travel-agent:
    image: ${IMAGE_REF:?}
    command:
      - uvicorn
      - travel_comparator.agents.travel_server:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "5003"
    environment: *worker-env
    expose: ["5003"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5003/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [travel]
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

networks:
  travel:
    driver: bridge

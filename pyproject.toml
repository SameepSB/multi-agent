[project]
name = "travel-comparator"
version = "1.0.0"
description = "A secure, request-scoped multi-agent travel comparison service"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "openai==2.15.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.14.2",
  "pyjwt[crypto]==2.15.0",
  "azure-identity==1.25.1",
  "uvicorn[standard]==0.40.0",
]

[dependency-groups]
dev = [
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.10",
]

[project.scripts]
travel-comparator = "travel_comparator.cli.main:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_comparator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
